services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: omnitask-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnitask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnitask_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omnitask}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - omnitask-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-omnitask}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REDIS (for queues, caching, sessions)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: omnitask-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - omnitask-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # WORKER (BullMQ) — Development
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: omnitask-worker
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-omnitask-exports}
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omnitask-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  omnitask-network:
    driver: bridge
